server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Re-resolve Compose service names after the API container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    location /api/ {
        set $client_api http://web-server:4000;
        proxy_pass $client_api;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
